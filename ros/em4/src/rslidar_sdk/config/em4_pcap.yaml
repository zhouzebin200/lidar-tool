common:
  msg_source: 3
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSEM4
      msop_port: 34870
      difop_port: 34872  # DIFOP2 calibration, not status port 34869
      imu_port: 0
      host_address: "0.0.0.0"
      group_address: "0.0.0.0"
      use_vlan: true
      user_layer_bytes: 0
      tail_layer_bytes: 0
      socket_recv_buf: 8388608
      wait_for_difop: true
      min_distance: 0.2
      max_distance: 300.0
      dense_points: true
      use_lidar_clock: true
      ts_first_point: true
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: ""
    ros:
      ros_frame_id: rslidar
      ros_recv_packet_topic: /EM4_rslidar_packets
      ros_send_packet_topic: /EM4_rslidar_packets
      ros_send_point_cloud_topic: /EM4_rslidar_points
      ros_queue_length: 3
