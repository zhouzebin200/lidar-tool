- module-name: 'ulv'
  dlls:
    - from_filenames:
        relative_path: '../plugins'
        prefixes:
          - 'libulv_'
        suffixes:
          - 'dll'
      dest_path: 'plugins'
      when: 'win32'
    - by_code:
        setup_code: 'import os, sys'
        filename_code: "[os.path.join(sys.base_prefix, name) for name in ('vcruntime140.dll', 'vcruntime140_1.dll')]"
      dest_path: '.'
      when: 'win32'
    - from_filenames:
        relative_path: '../vendor/npcap'
        prefixes:
          - 'npcap-1.90'
        suffixes:
          - 'exe'
      dest_path: 'vendor/npcap'
      executable: 'yes'
      when: 'win32'
