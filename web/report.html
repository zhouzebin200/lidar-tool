<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>砺见智行工作室激光雷达测试工具</title><link rel="stylesheet" href="report.css"></head>
<body><header><div><small>砺见智行工作室 / LIDAR TEST</small><h1>砺见智行工作室激光雷达测试工具</h1></div><div class="actions"><button id="load">打开草稿</button><button id="save">保存草稿</button><button id="preview" class="primary">生成报告</button></div></header>
<main><aside><h3>检测项目</h3><nav id="sections"></nav><p>图片与草稿仅在本机处理。请定期保存草稿文件。</p><button id="read">读取查看器设备</button><select id="devices" aria-label="选择雷达设备"><option value="">请选择设备</option></select><button id="useDevice">填入所选设备</button><div class="web-scraper-box" style="margin-top:14px;padding-top:12px;border-top:1px solid #e0e6ed;"><label style="font-size:12px;font-weight:600;color:#20304a;display:block;margin-bottom:4px;">雷达 IP（自动识别，可选覆盖）<input id="lidarWebIp" value="" placeholder="等待查看器自动识别" style="width:100%;margin:4px 0 8px;padding:6px;font-size:13px;"></label><button id="fetchLidarWeb" class="primary" style="width:100%;padding:8px 6px;font-size:13px;" title="自动通过 TCP 9347 (禾赛 AT128/AT128P) 或 Web 网页后台，解析S/N、软硬件版本、生产日期、工时、转速、电压电流及网络配置并带入报告">一键采集雷达参数</button></div><p id="message" role="status"></p></aside>
<article><section class="card"><h2>基本信息</h2><div id="meta" class="grid"></div></section><section id="sectionCard" class="card"><div class="section-title"><div><small id="step"></small><h2 id="sectionTitle"></h2></div><select id="result" aria-label="检测结论"><option selected>正常</option><option>合格</option><option>不合格</option><option>未检测</option><option>不适用</option></select></div><p id="hint"></p><div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px;"><label for="notes" style="margin:0;font-weight:600;">检测记录 / 实测数据</label><button id="genAppearanceNotes" type="button" class="button" style="display:none;padding:3px 10px;font-size:12px;" title="根据当前照片及缺陷标注自动生成标准外观检验记录">根据标注生成外观记录</button></div><textarea id="notes" rows="5" placeholder="填写测试方法、实测数值、判定标准和异常情况"></textarea><div class="actions"><label class="button">选择图片<input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label><span>支持 JPG、PNG、WebP；每张最大 15 MB</span></div><div id="gallery"></div></section><section class="card"><div class="section-title"><h2>综合意见</h2><button id="fillSummary" type="button" class="button" style="padding:4px 10px;font-size:12px;" title="恢复默认综合意见模板">恢复默认模板</button></div><textarea id="summary" rows="3" placeholder="维修建议、附件说明、复检要求等"></textarea></section></article></main>
<dialog id="editor"><div class="section-title"><h2>图片标注</h2><button id="closeEditor">完成标注</button></div><p>输入标注文字，在图片上拖动框选区域。标注会随图片一起导出。</p><div class="actions"><input id="annotationText" placeholder="例如：外壳划痕、接口松动" maxlength="100"><button id="undo">撤销上一处</button></div><canvas id="canvas"></canvas></dialog>
<dialog id="reportDialog"><div class="actions"><button id="print" class="primary">打印 / 保存 PDF</button><button id="exportPng">导出 PNG 图片</button><button id="exportHtml">下载完整 HTML 报告</button><button id="closeReport">返回编辑</button></div><iframe id="reportFrame" title="报告预览"></iframe></dialog>
<input id="draft" type="file" accept=".json" hidden><script src="report.js"></script><script src="report-assessment.js"></script><script src="report-export.js"></script><script src="report-viewer-link.js"></script></body></html>
